device: "cuda:0"

model:
  checkpoint: "checkpoints/restore/best.pt"
  base_channels: 64
  encoder_channels: [128, 256, 512]
  num_res_blocks: 4
  timesteps: 1000
  temporal_window: 3           # frames attended simultaneously (must be odd)
  n_heads: 4                   # temporal attention heads

inference:
  ddim_steps: 6                # denoising steps (1 = fast, 50 = quality); 6 is enough at t_start=200
  t_start: 200                 # img2img start timestep; lower = more faithful to input
  tile_size: 256               # process as 256×256 tiles matching training patch size
  tile_overlap: 32             # overlap between tiles for Gaussian blending
  color_fix: false             # _save_samples does not apply color_fix
  batch_size: 1                # window batches processed at once
  tile_batch_size: 4           # tiles per DDIM call; reduce if OOM (try 2 or 1)
  roi_restore_strength: 1.0    # 0=keep decompressed ROI, 1=fully restore ROI (BG always 1.0)

output:
  out_dir: "outputs/restoration"

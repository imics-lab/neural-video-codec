input:
  video_path: ""               # override via --video CLI argument
  # Resize input to this exact resolution before compression.
  # "WxH" string, e.g. "1080x720". Leave empty to keep original size.
  input_resolution: "480x360"

compression:
  config: "configs/gpu/compression.yaml"

decompression:
  config: "configs/gpu/decompression.yaml"

restoration:
  config: "configs/gpu/restoration.yaml"
  enable: true

upscaling:
  config: "configs/gpu/upscaling.yaml"
  enable: true

pid_upscaling:
  # pid_repo: "/path/to/PiD"          # omit if pid is pip-installed
  backbone: "flux2"                    # flux, flux2, sd3, sdxl, qwenimage, ...
  checkpoint_path: ""                  # required: path to downloaded .pth checkpoint
  pid_ckpt_type: "2k"                  # "2k" (up to 2048px) or "2kto4k"
  load_ema_to_reg: true
  pid_steps: 4                         # 4 = standard for distilled checkpoints
  cfg_scale: 1.0                       # 1.0 for distilled models
  shift: 1.0
  color_fix: "adain"                   # "adain", or "" to disable
  seed: 42
  prompt: "high quality, sharp details, professional wildlife photograph, natural colors"

output:
  out_dir: "outputs/pipeline"
  save_intermediate: false     # write decompressed and restored frames to disk

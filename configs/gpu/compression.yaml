detection:
  model_path: "models/md_v5a.0.0.pt"
  variant: "megadetector"
  device: "cuda:0"
  half: true
  processing_scale: 1.00       # run detector at full input resolution (important at low res)
  imgsz: 640
  conf: 0.10
  iou_nms: 0.50
  bbox_pad_frac: 0.10          # expand each bbox by this fraction of its own size
  bbox_pad_px: 8               # additional fixed-pixel padding
  keyframe_interval: 15        # run full YOLO every N frames; track between keyframes
  tracking:
    enabled: true
    min_hits: 1                # confirmations before a track is emitted
    max_det_gap: 180           # frames a track can survive without a detection
    mask_hold_frames: 15       # keep last known bbox for N frames after detection loss
    match_iou: 0.30            # IoU threshold for detection→track assignment
    vel_smooth: 0.70           # EMA coefficient for velocity smoothing

compression:
  dcvc:
    repo_dir: "DCVC"
    model_i: "models/cvpr2025_image.pth.tar"
    model_p: "models/cvpr2025_video.pth.tar"
    device: "cuda:0"
    use_cuda: true
    cuda_idx: 0
    reset_interval: 32
    intra_period: -1           # -1 = first frame only is I-frame
    force_zero_thres: null
  quality:
    roi_qp_i: 63               # high quality for ROI I-frames
    roi_qp_p: 63               # high quality for ROI P-frames
    bg_qp_i: 5                 # aggressive background compression (0=worst, 63=best)
    bg_qp_p: 5                 # aggressive background compression (0=worst, 63=best)
  roi:
    dilate_px: 8               # dilate ROI mask before stream split
    min_conf: 0.25             # minimum detection confidence to include in ROI

restoration:
  config: "configs/gpu/restoration.yaml"
  enable: true

wan_upscaling:
  model_id: "Wan-AI/Wan2.1-I2V-14B-480P-Diffusers"
  out_w: 960
  out_h: 720
  chunk_frames: 17        # frames per Wan2.1 call (match model's temporal window)
  overlap_frames: 4       # blend overlap between chunks
  num_steps: 20           # diffusion steps
  guidance_scale: 5.0
  cpu_offload: true       # offload to CPU between ops to save VRAM
  seed: 42

cogvideo_upscaling:
  model_id: "THUDM/CogVideoX-5b"
  out_w: 720
  out_h: 480
  strength: 0.55          # 0=no change, 1=fully regenerated; 0.5-0.6 preserves content
  chunk_frames: 49        # frames per call (must satisfy (n-1)%8==0); 49 ≈ 1.6s at 30fps
  overlap_frames: 8       # blend overlap between chunks
  num_steps: 50
  guidance_scale: 6.0
  cpu_offload: true
  seed: 42

output:
  out_dir: "outputs/compression"

scale: 4
device: cuda

model:
  checkpoint: models/diffusion_4x.pth
  base_channels: 64
  encoder_channels: [128, 256, 512]
  num_res_blocks: 4
  timesteps: 1000

inference:
  ddim_steps: 8
  t_start: 600
  color_fix: true
  tile_size: 768
  tile_overlap: 64

roi:
  padding: 16
  default_weight: 3.0

output:
  codec: h264
  crf: 18
